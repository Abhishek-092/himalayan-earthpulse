[project]
name = "earthpulse"
version = "0.1.0"
description = "HIMALAYAN EARTHPULSE - NISAR surface-change analysis pipeline (BDM/GDM/CDM/EPITN)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "xarray>=2024.6",
  "h5py>=3.11",
  "fsspec>=2024.6",
  "aiohttp>=3.9",
  "requests>=2.32",
  "earthaccess>=0.12",
  "asf_search>=8.0",
  "rasterio>=1.3.10",
  "pyproj>=3.6",
  "shapely>=2.0",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pydantic>=2.7",
  "pillow>=10.3",
  "matplotlib>=3.9",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "zarr>=2.18",
  "s3fs>=2024.6",
  "fiona>=1.10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
earthpulse = "earthpulse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
